services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: dgviz
      POSTGRES_USER: dgviz
      POSTGRES_PASSWORD: dgviz
    ports:
      - "5432:5432"
    volumes:
      - dgviz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgviz -d dgviz"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      notifications:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - dgviz_workspace:/data/dgviz
    environment:
      DGVIZ_DB_URL: jdbc:postgresql://db:5432/dgviz
      DGVIZ_DB_USER: dgviz
      DGVIZ_DB_PASSWORD: dgviz
      DGVIZ_ADMIN_USER: admin
      DGVIZ_ADMIN_PASSWORD: admin
      DGVIZ_PORT: "8080"
      DGVIZ_WORKSPACE_DIR: /data/dgviz
      DGVIZ_NOTIFICATIONS_URL: http://notifications:8082
      DGVIZ_NOTIFICATIONS_API_KEY: ${DGVIZ_NOTIFICATIONS_API_KEY:-dgviz-notify-dev-key}
      DGVIZ_PUBLIC_BASE_URL: ${DGVIZ_PUBLIC_BASE_URL:-http://localhost:8080}
      DGVIZ_INVITE_TTL_DAYS: ${DGVIZ_INVITE_TTL_DAYS:-2}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SNYK_TOKEN: ${SNYK_TOKEN:-}
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: dgviz-notifications/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DGVIZ_DB_URL: jdbc:postgresql://db:5432/dgviz
      DGVIZ_DB_USER: dgviz
      DGVIZ_DB_PASSWORD: dgviz
      DGVIZ_NOTIFICATIONS_PORT: "8082"
      DGVIZ_NOTIFICATIONS_API_KEY: ${DGVIZ_NOTIFICATIONS_API_KEY:-dgviz-notify-dev-key}
      DGVIZ_SMTP_HOST: ${DGVIZ_SMTP_HOST:-}
      DGVIZ_SMTP_PORT: ${DGVIZ_SMTP_PORT:-587}
      DGVIZ_SMTP_USER: ${DGVIZ_SMTP_USER:-}
      DGVIZ_SMTP_PASSWORD: ${DGVIZ_SMTP_PASSWORD:-}
    restart: unless-stopped

  adminer:
    image: adminer:4
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  dgviz_pg:
  dgviz_workspace:
