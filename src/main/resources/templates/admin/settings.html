<!DOCTYPE html>
<html th:replace="~{fragments/shell :: page('Настройки · DGViz', 'admin-settings', ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="main">
  <div th:if="${success}" class="flash ok" th:text="${success}"></div>
  <div th:if="${error}" class="flash err" th:text="${error}"></div>
  <h1>Configuration settings</h1>
  <p class="muted">Editable runtime parameters (DB). Secrets are masked; leave masked value to keep current secret.</p>

  <div class="card">
    <h2>Create setting</h2>
    <form th:action="@{/admin/settings}" method="post" class="stack">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-row">
        <input type="text" name="key" placeholder="sync.nvd-api-key" required/>
        <input type="text" name="value" placeholder="value"/>
        <input type="text" name="description" placeholder="description"/>
        <label class="checkbox"><input type="checkbox" name="secret" value="true"/> secret</label>
        <button class="btn btn-sm" type="submit">Create</button>
      </div>
    </form>
  </div>

  <div class="card table-wrap">
    <table>
      <thead><tr><th>Key</th><th>Value</th><th>Description</th><th>Secret</th><th>Updated</th><th></th></tr></thead>
      <tbody>
      <tr th:each="s : ${settings}">
        <td class="mono" th:text="${s.key}">key</td>
        <td colspan="4">
          <form th:action="@{|/admin/settings/${s.id}|}" method="post" class="form-row">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="value" th:value="${s.maskedValue()}"/>
            <input type="text" name="description" th:value="${s.description}"/>
            <label class="checkbox"><input type="checkbox" name="secret" value="true" th:checked="${s.secret}"/> secret</label>
            <button class="btn btn-sm" type="submit">Save</button>
          </form>
          <div class="muted" th:text="${s.updatedAt}">-</div>
        </td>
        <td>
          <form th:action="@{|/admin/settings/${s.id}/delete|}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</th:block>
</body>
</html>
