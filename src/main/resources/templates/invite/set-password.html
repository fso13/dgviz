<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Set password · DGViz</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" th:href="@{/css/dgviz.css}"/>
</head>
<body class="login-page">
<div class="login-hero">
  <div class="login-hero__copy" style="max-width:28rem">
    <p class="eyebrow">invitation</p>
    <h1>Set your password</h1>
    <p class="muted">
      User <strong class="mono" th:text="${username}">user</strong>
      (<span th:text="${email}">mail</span>).
      Link valid until <span th:text="${expiresAt}">-</span>.
    </p>
    <div th:if="${error}" class="flash err" th:text="${error}"></div>
    <form th:action="@{|/invite/${token}|}" method="post" class="stack">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label class="field">Password (min 8 chars)
        <input type="password" name="password" required minlength="8" autocomplete="new-password"/>
      </label>
      <label class="field">Confirm password
        <input type="password" name="passwordConfirm" required minlength="8" autocomplete="new-password"/>
      </label>
      <button class="btn" type="submit">Save and continue</button>
    </form>
  </div>
</div>
</body>
</html>
