<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${subject}">DGViz report</title>
</head>
<body style="margin:0;padding:0;background:#f4f5fa;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1f2430;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5fa;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="640" cellspacing="0" cellpadding="0"
             style="max-width:640px;width:100%;background:#ffffff;border:1px solid #e3e6ef;border-radius:10px;overflow:hidden;">
        <tr>
          <td style="padding:18px 22px;background:#282a36;color:#f8f8f2;">
            <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#bd93f9;">DGViz · Security report</div>
            <h1 style="margin:8px 0 0;font-size:20px;line-height:1.3;" th:text="${title}">Отчёт</h1>
            <p style="margin:8px 0 0;color:#cfcfe6;font-size:13px;">
              <span th:text="${subtitle}">0 уязвимостей</span>
              <span th:if="${criticalCount > 0}" th:text="${' · ' + criticalCount + ' critical'}" style="color:#ff5555;"> · critical</span>
              <span th:text="${' · ' + generatedAt}" style="color:#8b8ba3;"> · time</span>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:22px;">
            <p style="margin:0 0 14px;" th:text="${'Здравствуйте, ' + recipientName + '!'}">Здравствуйте!</p>
            <p style="margin:0 0 18px;color:#4a5160;" th:text="${intro}">intro</p>

            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                   style="margin:0 0 18px;border:1px solid #e3e6ef;border-radius:8px;background:#fbfbfe;">
              <tr th:each="row, stat : ${details}">
                <td th:style="${stat.first} ? 'padding:10px 14px;width:34%;color:#6272a4;font-size:12px;' : 'padding:10px 14px;border-top:1px solid #eceef5;width:34%;color:#6272a4;font-size:12px;'"
                    th:text="${row.label()}">label</td>
                <td th:style="${stat.first} ? 'padding:10px 14px;font-size:13px;font-family:ui-monospace,Menlo,monospace;' : 'padding:10px 14px;border-top:1px solid #eceef5;font-size:13px;font-family:ui-monospace,Menlo,monospace;'"
                    th:text="${row.value()}">value</td>
              </tr>
            </table>

            <div th:if="${severities != null and !#lists.isEmpty(severities)}"
                 style="margin:0 0 18px;padding:12px 14px;border:1px solid #e3e6ef;border-radius:8px;background:#fbfbfe;">
              <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6272a4;margin:0 0 10px;">
                По severity
              </div>
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td th:each="s : ${severities}" style="padding:0 8px 8px 0;">
                    <span th:style="|display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#282a36;background:${s.color()}33;border:1px solid ${s.color()}88;|">
                      <span th:text="${s.severity()}">HIGH</span>
                      <span th:text="${' · ' + s.count()}"> · 0</span>
                    </span>
                  </td>
                </tr>
              </table>
            </div>

            <div style="margin:0 0 18px;padding:12px 14px;border:1px solid #e3e6ef;border-radius:8px;background:#ffffff;">
              <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6272a4;margin:0 0 8px;">
                Вложения
              </div>
              <ul style="margin:0;padding-left:18px;color:#4a5160;font-size:13px;line-height:1.6;">
                <li>PDF — отчёт по уязвимостям</li>
                <li>CSV — список уязвимостей</li>
                <li>TXT — дерево зависимостей</li>
              </ul>
            </div>

            <p th:if="${ctaUrl != null and !#strings.isEmpty(ctaUrl)}" style="margin:8px 0 0;">
              <a th:href="${ctaUrl}"
                 style="display:inline-block;padding:10px 14px;background:#bd93f9;color:#282a36;text-decoration:none;border-radius:6px;font-weight:700;">
                Открыть репозиторий в DGViz
              </a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 22px;background:#f7f8fc;color:#6272a4;font-size:12px;">
            Письмо-отчёт · DGViz
            <span th:if="${recipientCount != null}" th:text="${' · ' + recipientFooter}"> · </span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
