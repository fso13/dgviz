<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${subject}">DGViz</title>
</head>
<body style="margin:0;padding:0;background:#f4f5fa;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1f2430;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5fa;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="640" cellspacing="0" cellpadding="0"
             style="max-width:640px;width:100%;background:#ffffff;border:1px solid #e3e6ef;border-radius:10px;overflow:hidden;">
        <tr>
          <td style="padding:18px 22px;background:#282a36;color:#f8f8f2;">
            <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#bd93f9;">DGViz</div>
            <h1 style="margin:8px 0 0;font-size:20px;line-height:1.3;" th:text="${title}">Приглашение</h1>
            <p style="margin:8px 0 0;color:#8b8ba3;font-size:13px;" th:text="${generatedAt}">time</p>
          </td>
        </tr>
        <tr>
          <td style="padding:22px;">
            <p style="margin:0 0 14px;" th:text="${'Здравствуйте, ' + recipientName + '!'}">Здравствуйте!</p>
            <p style="margin:0 0 14px;color:#4a5160;" th:text="${intro}">intro</p>
            <p th:each="paragraph : ${paragraphs}" style="margin:0 0 14px;color:#4a5160;" th:text="${paragraph}">p</p>

            <table th:if="${details != null and !#lists.isEmpty(details)}" role="presentation" width="100%"
                   cellspacing="0" cellpadding="0"
                   style="margin:8px 0 18px;border:1px solid #e3e6ef;border-radius:8px;background:#fbfbfe;">
              <tr th:each="row, stat : ${details}">
                <td th:style="${stat.first} ? 'padding:10px 14px;width:34%;color:#6272a4;font-size:12px;' : 'padding:10px 14px;border-top:1px solid #eceef5;width:34%;color:#6272a4;font-size:12px;'"
                    th:text="${row.label()}">label</td>
                <td th:style="${stat.first} ? 'padding:10px 14px;font-size:13px;' : 'padding:10px 14px;border-top:1px solid #eceef5;font-size:13px;'"
                    th:text="${row.value()}">value</td>
              </tr>
            </table>

            <p th:if="${ctaUrl != null and !#strings.isEmpty(ctaUrl)}" style="margin:8px 0 0;">
              <a th:href="${ctaUrl}"
                 th:text="${ctaLabel}"
                 style="display:inline-block;padding:10px 14px;background:#bd93f9;color:#282a36;text-decoration:none;border-radius:6px;font-weight:700;">
                Открыть
              </a>
            </p>
            <p th:if="${ctaUrl != null and !#strings.isEmpty(ctaUrl)}"
               style="margin:14px 0 0;font-size:12px;color:#6272a4;word-break:break-all;">
              Если кнопка не работает, откройте ссылку:<br/>
              <a th:href="${ctaUrl}" th:text="${ctaUrl}" style="color:#7c4dff;text-decoration:none;">link</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 22px;background:#f7f8fc;color:#6272a4;font-size:12px;">
            Служебное уведомление · DGViz
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
