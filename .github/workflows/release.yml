name: Release Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.3.1). Leave empty to use run id."
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            RAW="${{ inputs.tag }}"
          else
            RAW="sha-${GITHUB_SHA::7}"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "raw=${RAW}" >> "$GITHUB_OUTPUT"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} owner=${OWNER_LC}"

      - name: Docker meta (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/dgviz
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Docker meta (notifications)
        id: meta-notify
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/dgviz-notifications
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push notifications image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dgviz-notifications/Dockerfile
          push: true
          tags: ${{ steps.meta-notify.outputs.tags }}
          labels: ${{ steps.meta-notify.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DGViz ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            build/libs/dgviz*.jar
          body: |
            ## Docker images

            ```bash
            docker pull ghcr.io/${{ steps.meta.outputs.owner }}/dgviz:${{ steps.meta.outputs.version }}
            docker pull ghcr.io/${{ steps.meta.outputs.owner }}/dgviz-notifications:${{ steps.meta.outputs.version }}
            ```

            Also tagged as `latest`.

            ## Docs

            - Site: https://${{ steps.meta.outputs.owner }}.github.io/dgviz/
            - User docs: https://${{ steps.meta.outputs.owner }}.github.io/dgviz/user/
            - Admin docs: https://${{ steps.meta.outputs.owner }}.github.io/dgviz/admin/
